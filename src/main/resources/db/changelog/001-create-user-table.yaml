databaseChangeLog:
  - changeSet:
      id: '001'
      author: himanshu
      changes:
        - createTable:
            tableName: user_tbl
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: keycloak_id
                  type: VARCHAR(250)
                  constraints:
                    unique: true
              - column:
                  name: full_name
                  type: VARCHAR(250)
              - column:
                  name: email
                  type: VARCHAR(250)
                  constraints:
                    unique: true
              - column:
                  name: phone
                  type: VARCHAR(250)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: address
                  type: VARCHAR(250)
              - column:
                  name: role
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: DATE
              - column:
                  name: updated_at
                  type: DATE